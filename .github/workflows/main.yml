name: Build Android APK

# Runs on every change to main, or by hand: Actions -> Build Android APK -> Run workflow.
# Makes BubbleTap.apk (install directly) and, once the signing secrets are saved, BubbleTap.aab (Google Play).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Lets you upload the whole game as one zip from a phone: this unpacks it into the repository.
      - name: Unpack uploaded zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              rm -rf /tmp/u && mkdir -p /tmp/u && unzip -q -o "$z" -d /tmp/u
              src=/tmp/u; [ -d /tmp/u/bubble-tap ] && src=/tmp/u/bubble-tap
              rm -rf "$src/.github"
              cp -r "$src/." .
              git rm -q --cached "$z" 2>/dev/null || true; rm -f "$z"
            done
            git add -A
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Unpack game files from zip" && git push || echo "nothing to commit"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App settings (vibration, no reload on resize)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q VIBRATE "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          grep -q 'configChanges="[^"]*density' "$M" || sed -i 's#android:configChanges="#android:configChanges="density|#' "$M"
          grep -E "configChanges|VIBRATE" "$M"
          grep -E "Sdk" android/variables.gradle

      - name: Add app icon and splash screen
        run: |
          R=android/app/src/main/res
          for d in assets/android/res/*/; do
            n=$(basename "$d"); [ "$n" = values ] && continue
            mkdir -p "$R/$n" && cp -r "$d." "$R/$n/"
          done
          # Set the icon background color wherever the template defines it
          F=$(grep -l 'name="ic_launcher_background"' $R/values/*.xml || true)
          if [ -n "$F" ]; then sed -i -E 's#(<color name="ic_launcher_background">)[^<]*#\1\#EDEFFF#' $F; else cp assets/android/res/values/ic_launcher_background.xml $R/values/; fi
          grep -h ic_launcher_background $R/values/*.xml

      - name: Copy the game into the app
        run: npx cap sync android

      # Google Play needs a higher version number for every upload, so use the build number.
      - name: Set version number
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"
          grep -E "versionCode|versionName" "$G"

      - name: Build APK (for sharing directly)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../BubbleTap.apk

      # The Play Store file. Only runs once the two signing secrets are saved in the repository settings.
      - name: Build and sign the Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        run: |
          (cd android && ./gradlew bundleRelease --no-daemon --stacktrace)
          A=android/app/build/outputs/bundle/release/app-release.aab
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$A" upload
          rm -f "$RUNNER_TEMP/upload.jks"
          cp "$A" BubbleTap.aab

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: BubbleTap-android
          path: |
            BubbleTap.apk
            BubbleTap.aab
          if-no-files-found: warn

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bubble Tap (latest build)"
          body: |
            BubbleTap.apk - open it on an Android phone or tablet to install the game directly.
            BubbleTap.aab - the file to upload to the Google Play Console (only present once signing is set up).
          files: |
            BubbleTap.apk
            BubbleTap.aab
          make_latest: true
